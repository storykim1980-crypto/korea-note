<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | SEOUL NOTE</title>
  <style>
    :root { color-scheme: light; --paper:#f7f5ef; --white:#fffefb; --ink:#21342d; --muted:#646c65; --terra:#925944; --line:rgba(33,52,45,.18); }
    * { box-sizing:border-box; }
    body { font-size:17.6px; margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
    main { width:min(100%,680px); padding:clamp(26px,6vw,58px); border:1px solid var(--line); background:var(--white); box-shadow:0 20px 60px rgba(31,43,37,.08); }
    .brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:36px; color:var(--ink); text-decoration:none; font-family:Georgia,serif; letter-spacing:.14em; }
    .mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--terra); border-radius:50%; color:var(--terra); transform:rotate(-8deg); }
    .eyebrow { margin:0 0 8px; color:var(--terra); font-size:15px; font-weight:700; letter-spacing:.16em; }
    h1 { margin:0 0 18px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(52px,10vw,82px); line-height:1; font-weight:500; }
    h2 { margin:24px 0 5px; font-size:18.5px; font-weight:600; }
    p { font-size:17.6px; max-width:54ch; margin:6px 0; color:#435249; }
    nav { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
    nav a { min-height:48px; font-size:15.6px; display:inline-flex; align-items:center; padding:9px 14px; border:1px solid var(--ink); color:var(--ink); text-decoration:none; }
    nav a:first-child { color:#fffefb; background:var(--ink); }
    nav a:focus-visible { outline:3px solid var(--terra); outline-offset:3px; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  
    /* Readability pass 3: stronger text size and a more compact small-screen card */
    body { font-size: 17.8px; line-height: 1.66; padding: 20px; }
    p { font-size: 17.4px; line-height: 1.72; margin: 8px 0; }
    .eyebrow { font-size: 15px; }
    h2 { font-size: 18.3px; }
    nav { margin-top: 22px; }
    nav a { font-size: 15.7px; }
    main { padding: clamp(24px, 5vw, 50px); }
    .brand { margin-bottom: 26px; }
    @media(max-width:520px) {
      body { font-size: 17.4px; padding: 14px; }
      p { font-size: 17.0px; line-height: 1.68; }
      main { padding: 20px 18px; }
      .brand { margin-bottom: 22px; }
      nav { gap: 8px; margin-top: 18px; }
    }


/* Balanced reading scale, HIS-inspired native Gothic; exact HIS CSS unverified. */
html[lang="ja"] { --sans: Arial, "メイリオ", Meiryo, "ヒラギノ角ゴ Pro W3", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; --serif: var(--sans); }
html[lang="en"] [lang="ja"] { font-family: Arial, Meiryo, "Hiragino Kaku Gothic ProN", sans-serif; }
body { font-size:18px; line-height:1.8; letter-spacing:0; }
html[lang="ja"] body, html[lang="ja"] button, html[lang="ja"] input, html[lang="ja"] select, html[lang="ja"] textarea { font-family:var(--sans); }
html[lang="ja"] { line-break:strict; word-break:normal; }
p, li, dd { overflow-wrap:break-word; }
h1,h2,h3,h4 { word-break:normal; overflow-wrap:break-word; }
@media(max-width:760px){body {font-size:17.5px;line-height:1.8;}}
p{font-size:18px;line-height:1.8;}h1{font-size:clamp(38px,7vw,64px);}
/* Balance actual heading lines; preserve natural paragraph rhythm. */
h1,h2,h3,h4 {text-wrap:balance;}
p {text-wrap:pretty;}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] h3 {line-break:strict;}
</style>
<link rel="stylesheet" href="assets/editorial.css">
</head>
<body>
  <main>
    <a class="brand" href="/"><span class="mark" aria-hidden="true">S</span><span>SEOUL NOTE</span></a>
    <p class="eyebrow">404 · NOT FOUND</p>
    <h1>We can’t find that page.</h1>
    <p>The address may have changed, or the link may be out of date. Choose a language to return to the guide.</p>
    <h2 lang="ja">ページが見つかりません。</h2>
    <p lang="ja">URLが変わったか、リンクが古い可能性があります。言語を選んでガイドへお戻りください。</p>
    <nav aria-label="Choose a language">
      <a href="/" lang="ja">日本語版へ</a>
      <a href="/en/" lang="en">English edition</a>
    </nav>
  </main>
</body>
</html>
